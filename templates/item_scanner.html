{% extends "base.html" %}

{% block title %}Add New Item - AI Food Inventory{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-plus-circle text-primary"></i> Add New Inventory Item</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-boxes"></i> Item Details</h5>
        </div>
        <div class="card-body p-4">
            <form id="itemForm" onsubmit="event.preventDefault(); saveItem();">
                <input type="hidden" id="itemId">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Name *</label>
                        <input type="text" id="name" class="form-control" placeholder="Item Name (e.g. Fresh Milk)" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Category *</label>
                        <select id="category" class="form-select" required>
                            <option value="">Select Category</option>
                            <option value="Dairy">Dairy</option>
                            <option value="Bakery">Bakery</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Fruits">Fruits</option>
                            <option value="Meat">Meat</option>
                            <option value="Frozen">Frozen</option>
                            <option value="Snacks">Snacks</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Quantity *</label>
                        <input type="number" id="quantity" class="form-control" placeholder="100" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Price Per Unit (₹) *</label>
                        <input type="number" step="0.01" id="price" class="form-control" placeholder="50.00" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Expiry Date *</label>
                        <input type="date" id="expiry_date" class="form-control" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'inventory' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-save me-2"></i> Save Item
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function saveItem() {
        const id = document.getElementById("itemId").value;
        const data = {
            name: document.getElementById("name").value,
            category: document.getElementById("category").value,
            quantity: document.getElementById("quantity").value,
            price: document.getElementById("price").value,
            expiry_date: document.getElementById("expiry_date").value
        };

        if (id) {
            fetch(`/api/items/${id}/`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(response => {
                    if (response.success) {
                        alert("Item updated successfully!");
                        window.location.href = "{% url 'inventory' %}";
                    } else {
                        alert("Error: " + response.error);
                    }
                });
        } else {
            fetch("/api/items/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(response => {
                    if (response.success) {
                        alert("Item saved successfully!");
                        window.location.href = "{% url 'inventory' %}";
                    } else {
                        alert("Error: " + response.error);
                    }
                });
        }
    }
</script>
{% endblock %}
