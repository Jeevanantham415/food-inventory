{% extends "base.html" %}

{% block title %}Add Item - Food Inventory System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i> Add New Inventory Item</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{% url 'add_item' %}">
                        {% csrf_token %}
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Item Name *</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g. Fresh Whole Milk" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category *</label>
                                <select name="category" class="form-select" required>
                                    <option value="">Select Category</option>
                                    <option value="Dairy">Dairy</option>
                                    <option value="Bakery">Bakery</option>
                                    <option value="Beverages">Beverages</option>
                                    <option value="Vegetables">Vegetables</option>
                                    <option value="Fruits">Fruits</option>
                                    <option value="Meat">Meat</option>
                                    <option value="Frozen">Frozen</option>
                                    <option value="Snacks">Snacks</option>
                                    <option value="Grains">Grains</option>
                                    <option value="Groceries">Groceries</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Quantity *</label>
                                <input type="number" name="quantity" class="form-control" placeholder="e.g. 50" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Price Per Unit (₹) *</label>
                                <input type="number" step="0.01" name="price" class="form-control" placeholder="e.g. 60.00" min="0.01" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Expiry Date *</label>
                                <input type="date" name="expiry_date" class="form-control" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'inventory' %}" class="btn btn-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save me-2"></i> Save Item
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
